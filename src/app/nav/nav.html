<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
  <div class="container">
    <!-- Logotipo o Nombre de la aplicación -->
    <a class="navbar-brand fw-bold" routerLink="/">
      <i class="bi bi-rocket-takeoff me-2 text-success"></i>Portal Ofertas
    </a>

    <!-- Botón Hamburguesa para pantallas móviles (Controlado con Angular) -->
    <button
      class="navbar-toggler"
      type="button"
      (click)="toggleNavbar()"
      [attr.aria-expanded]="!menuColapsado"
      aria-label="Toggle navigation"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Enlaces de la barra de navegación (Sincronizados responsivamente) -->
    <!-- 🛠️ CORRECCIÓN: ngClass inyecta 'show' de Bootstrap si menuColapsado es false -->
    <div class="collapse navbar-collapse" [ngClass]="{ show: !menuColapsado }" id="navbarSimple">
      <ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-lg-center">
        <li class="nav-item">
          <a
            class="nav-link"
            routerLink="/"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
            (click)="cerrarMenuMovi()"
          >
            Inicio
          </a>
        </li>
        <li class="nav-item">
          <a
            class="nav-link"
            routerLink="/buscador"
            routerLinkActive="active"
            (click)="cerrarMenuMovi()"
          >
            Ofertas
          </a>
        </li>
        <li class="nav-item">
          <a
            class="nav-link"
            routerLink="/historial"
            routerLinkActive="active"
            (click)="cerrarMenuMovi()"
          >
            Mis Cursos
          </a>
        </li>
        <li class="nav-item">
          <a
            class="nav-link"
            routerLink="/contacto"
            routerLinkActive="active"
            (click)="cerrarMenuMovi()"
          >
            Contacto
          </a>
        </li>

        <!-- Botón de Acción Estilizado para Ingresar -->
        <li class="nav-item ms-lg-3 mt-2 mt-lg-0">
          <a
            routerLink="/ingresar"
            class="btn btn-success rounded-pill px-4 fw-bold shadow-sm btn-sm w-100 text-white"
            (click)="cerrarMenuMovi()"
            style="background-color: #39a900; border: none"
          >
            <i class="bi bi-box-arrow-in-right me-1"></i>Ingresar
          </a>
        </li>
      </ul>
    </div>
  </div>
</nav>
